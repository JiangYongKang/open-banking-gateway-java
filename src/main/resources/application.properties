spring.application.name=open-banking-gateway
server.port=8080

# 同意书默认有效期（创建后需在此时长内授权/使用，到期即时判定为 EXPIRED）
obg.consent.default-ttl=PT1H

# 合作方维度支付限流：每个合作方在每个窗口最多发起 obg.rate-limit.requests-per-window 次支付
# 被限流的请求不计入额度，也不改变任何余额
obg.rate-limit.requests-per-window=10
obg.rate-limit.window=PT1M

# 唯一允许的支付币种
obg.currency=CNY

# 幂等/回查记录保留窗口：提交结果（成功与业务拒绝）在此窗口内可按 Idempotency-Key 回查；
# 超窗记录被惰性清理，清理不影响已生效的支付与账务
obg.idempotency.retention=PT24H

# 业务日志：同意书状态迁移、幂等判定、限流判定依据
logging.level.com.github.highcumontoa=INFO
