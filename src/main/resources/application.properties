# 开放银行第三方接入网关 - 本地配置（无外部依赖）
server.port=8080

# 同意书默认有效期（秒）：到期后懒迁移为 EXPIRED
obg.gateway.consent-ttl-seconds=3600

# 合作方维度限流（令牌桶）
# 每合作方每分钟补充的令牌数
obg.gateway.rate-limit-permits-per-minute=20
# 每合作方令牌桶容量（允许的突发请求数）
obg.gateway.rate-limit-burst-capacity=20

# 业务日志（含幂等键、状态迁移与判定依据）
logging.level.com.github.highcumontoa=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n
